<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BetaJiu</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🥋 BetaJiu</h1>

<p>Gestão inteligente para Jiu-Jitsu</p>

</header>



<main>


<!-- LOGIN -->

<div id="login">

<h2>Login</h2>


<input id="usuario" placeholder="Usuário">


<input id="senha" type="password" placeholder="Senha">


<button onclick="entrar()">
ENTRAR
</button>


<p id="mensagem"></p>


</div>





<!-- PAINEL PRINCIPAL -->

<div id="painel" style="display:none">


<h2 id="tituloPainel"></h2>


<div id="opcoes"></div>


<br>

<button onclick="sair()">
Sair
</button>


</div>





<!-- TELA DE AULAS -->

<div id="telaAulas" style="display:none">


<h2>📅 Cadastro de Aulas</h2>


<input id="nomeAula" placeholder="Nome da aula">


<input id="diaAula" placeholder="Dia da semana">


<input id="horarioAula" placeholder="Horário">


<input id="professorAula" placeholder="Professor">


<button onclick="salvarAula()">
Salvar Aula
</button>



<h3>Aulas cadastradas:</h3>


<ul id="listaAulas"></ul>



<button onclick="voltarPainel()">
⬅ Voltar
</button>


</div>







<!-- TELA DE ALUNOS -->

<div id="telaAlunos" style="display:none">


<h2>👥 Cadastro de Alunos</h2>


<input id="nomeAluno" placeholder="Nome completo">


<input id="nascimentoAluno" placeholder="Data nascimento">


<input id="telefoneAluno" placeholder="Telefone">



<label>
🥋 Faixa atual
</label>


<select id="faixaAluno">


<option>Branca</option>


<option>Infantil - Cinza com Branco</option>

<option>Infantil - Cinza</option>

<option>Infantil - Cinza com Preto</option>



<option>Infantil - Amarela com Branco</option>

<option>Infantil - Amarela</option>

<option>Infantil - Amarela com Preto</option>



<option>Infantil - Laranja com Branco</option>

<option>Infantil - Laranja</option>

<option>Infantil - Laranja com Preto</option>



<option>Infantil - Verde com Branco</option>

<option>Infantil - Verde</option>

<option>Infantil - Verde com Preto</option>



<option>Azul</option>

<option>Roxa</option>

<option>Marrom</option>

<option>Preta</option>


</select>



<input id="grauAluno" placeholder="Grau">



<button onclick="salvarAluno()">
Salvar Aluno
</button>



<h3>Alunos cadastrados:</h3>


<ul id="listaAlunos"></ul>



<button onclick="voltarPainel()">
⬅ Voltar
</button>


</div>






</main>



<footer>

<p>
BetaJiu © 2026
</p>

</footer>



<script src="script.js"></script>


</body>

  </html>
